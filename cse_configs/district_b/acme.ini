[basic.config]
cseType=MN
cseID=id-mn-b
cseName=DistrictB-MN-CSE
adminID=CAdmin
networkInterface=127.0.0.1
cseHost=127.0.0.1
httpPort=8082
logLevel=info
databaseType=memory
consoleTheme=dark
consoleType=simple
secret=acme
serviceProviderID=//acme.example.com
registrarCseHost=127.0.0.1
registrarCsePort=8080
registrarCseID=id-in
registrarCseName=cse-in

[cse]
enableSubscriptionVerificationRequests=false

[cse.registration]
checkInterval=2
checkLiveliness=true

[logging]
enableFileLogging=true
level=info

[webui]
enable=true
root=/webui
