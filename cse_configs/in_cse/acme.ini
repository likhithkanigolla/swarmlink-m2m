[basic.config]
cseType=IN
cseID=id-in
cseName=cse-in
adminID=CAdmin
networkInterface=127.0.0.1
cseHost=127.0.0.1
httpPort=8080
logLevel=info
databaseType=memory
consoleTheme=dark
consoleType=simple
secret=acme
serviceProviderID=//acme.example.com
registrarCseHost=127.0.0.1
registrarCsePort=8080
registrarCseID=
registrarCseName=

[cse]
enableSubscriptionVerificationRequests=false

[cse.registration]
allowedCSROriginators=/id-mn-a,/id-mn-b
checkInterval=2
checkLiveliness=true

[logging]
enableFileLogging=true
level=info

[webui]
enable=true
root=/webui
